[project]
name = "margin-workspace"
version = "0.1.0"
description = "Monorepo workspace for margin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pandas-stubs>=3.0.5.260914",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.margin]
repository = "https://github.com/Waddah0-0/margin"
mirror-owner = "Waddah0-0"

[tool.uv.workspace]
members = [
    "packages/*",
    "agents/*",
]

[tool.uv.sources]
margin-core = { workspace = true }
margin-cli = { workspace = true }
margin-api = { workspace = true }
margin-ai-code-detector = { workspace = true }
margin-echo = { workspace = true }
margin-data-storyteller = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "ASYNC",  # flake8-async
]
ignore = []

[tool.mypy]
python_version = "3.11"
mypy_path = [
    "packages/core/src",
    "packages/cli/src",
    "packages/api/src",
    "agents/ai_code_detector/src",
    "agents/echo/src",
    "agents/data_storyteller/src",
]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "packages",
    "agents",
    "tests",
]
asyncio_mode = "auto"
