name: Release

# Publish to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand to TestPyPI first (Actions > Release > Run workflow).
#
# No PyPI password or token is stored anywhere: PyPI trusts this workflow directly
# ("trusted publishing"). Versions that are already on PyPI are skipped, so a tag publishes
# only the packages whose version changed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.21"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          uv python install 3.12
          uv sync --all-packages
          npm ci --prefix ui

      - name: Build, check and smoke-test the packages
        run: uv run python scripts/build_release.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    # One job per package, each with its own environment (pypi-<package>): PyPI's trusted
    # publishers are registered per package, and a package's job can only publish that package.
    # Keep this list in step with the publishable packages (scripts/build_release.py checks it).
    name: Publish ${{ matrix.package }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1  # margin-core first, so the others' dependency exists
      matrix:
        package: [margin-core, margin-cli, margin-api, margin-ai-code-detector, margin-commit-graph, margin-data-storyteller]
    environment:
      name: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'pypi' || 'testpypi' }}-${{ matrix.package }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Keep only ${{ matrix.package }}
        run: |
          prefix=$(echo "${{ matrix.package }}" | tr '-' '_')
          find dist -type f ! -name "${prefix}-[0-9]*" -delete
          ls dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: ${{ (github.event_name == 'push' || inputs.target == 'pypi') && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          skip-existing: true

  desktop-windows:
    name: Build & publish Windows installer
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.21"
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Decode Windows code-signing certificate (optional)
        id: cert
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
        run: |
          if ($env:WINDOWS_CERT_BASE64) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "margin-codesign.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
            "pfx_path=$pfxPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Build, sign, smoke-test, and package Windows installer
        shell: pwsh
        env:
          MARGIN_DISABLE_UPDATE_CHECK: "1"
          WINDOWS_CERT_PFX_PATH: ${{ steps.cert.outputs.pfx_path }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $versionArgs = @()
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME) {
            $versionArgs = @("--version", $env:GITHUB_REF_NAME.TrimStart("v", "V"))
          }
          uv run python desktop/build_windows.py @versionArgs

      - name: Remove temporary signing certificate
        if: always() && steps.cert.outputs.pfx_path != ''
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue "${{ steps.cert.outputs.pfx_path }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: margin-windows-installer
          path: |
            build/desktop/installer/margin-setup-*.exe
            build/desktop/installer/margin-setup-*.exe.sha256

      - name: Attach Windows installer to GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem build\desktop\installer\margin-setup-* | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title $tag --generate-notes
          }
