name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.21"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Type check with Mypy
        run: uv run python scripts/typecheck.py

      - name: Check agent folders follow the sub-repo standard
        run: uv run python scripts/check_agents.py

      - name: Check the exported OpenAPI schema is up to date
        run: uv run python scripts/export_openapi.py --check

      - name: Run tests with Pytest
        run: uv run pytest

  ui:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check the API types match openapi.json
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts

      - name: Lint and formatting (Biome)
        run: npx biome ci .

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx vite build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build
        run: docker build -t margin:ci .

      - name: Smoke test (API, UI and agents from the image)
        run: |
          docker run -d --name margin -p 127.0.0.1:8000:8000 margin:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/agents | grep -q ai-code-detector
          curl -sf -H 'accept: text/html' http://127.0.0.1:8000/runs/x | grep -q '<title>margin</title>'
          test "$(docker inspect --format '{{.Config.User}}' margin)" = margin
          docker rm -f margin

  packages:
    name: Packages (build, check, install, run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.21"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: |
          uv python install 3.12
          uv sync --all-packages
          npm ci --prefix ui

      - name: Build, check and smoke-test the packages, as a release would
        run: uv run python scripts/build_release.py

