[project]
name = "margin-api"
version = "0.1.0"
description = "margin's HTTP API and web UI: run agents in the background, follow them live, read their evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waddah Ali" }]
keywords = ["agents", "llm", "api", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Framework :: FastAPI",
    "Environment :: Web Environment",
]
dependencies = [
    "margin-core>=0.1.2,<0.2",  # 0.1.2: questions (ctx.ask)
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.2.0",
]

[project.scripts]
margin-api = "margin_api.main:run"

[project.urls]
Homepage = "https://github.com/Waddah0-0/margin"
Source = "https://github.com/Waddah0-0/margin/tree/main/packages/api"
Issues = "https://github.com/Waddah0-0/margin/issues"
Changelog = "https://github.com/Waddah0-0/margin/blob/main/packages/api/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/margin_api"]
# the built web UI, copied in by scripts/build_release.py (git-ignored, so listed here)
artifacts = ["src/margin_api/ui/**"]
