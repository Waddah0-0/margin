[project]
name = "margin-secret-leaks"
version = "0.1.0"
description = "Scans workspace files and git history for hardcoded secrets, API keys, private keys, and credentials."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waddah Ali" }]
keywords = ["secrets", "security", "credentials", "git-history", "agents"]
# Not published yet; remove this line when the agent is ready for PyPI.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "margin-core>=0.1.3,<0.2",  # 0.1.3: READ_ONLY_GIT_CONFIG, history reads never fetch
]

[project.urls]
Homepage = "https://github.com/Waddah0-0/margin"
Source = "https://github.com/Waddah0-0/margin/tree/main/agents/secret_leaks"
Issues = "https://github.com/Waddah0-0/margin/issues"
Changelog = "https://github.com/Waddah0-0/margin/blob/main/agents/secret_leaks/CHANGELOG.md"

[project.entry-points."margin.agents"]
secret-leaks = "secret_leaks.agent:SecretLeaksAgent"

[tool.margin]
id = "secret-leaks"
stage = "experimental"
# mirror = "Waddah0-0/margin-secret-leaks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secret_leaks"]
