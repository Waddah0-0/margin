[project]
name = "margin-echo"
version = "0.1.0"
description = "Reference echo agent for margin (smoke tests and examples)"
readme = "README.md"
requires-python = ">=3.11"
# a test fixture and template: PyPI rejects this classifier, so it can never be uploaded
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "margin-core>=0.1.2,<0.2",  # 0.1.2: questions (ctx.ask)
]

[project.entry-points."margin.agents"]
echo = "echo_agent.agent:EchoAgent"

[tool.margin]
id = "echo"
stage = "stable"
# Not mirrored: echo is a test fixture and template, not a real agent.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echo_agent"]
