[project]
name = "margin-commit-graph"
version = "0.1.0"
description = "Draws a repository's history as its tree and tells the story in it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waddah Ali" }]
# Not published yet; remove this line when the agent is ready for PyPI.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "margin-core>=0.1.0,<0.2",
]

[project.urls]
Homepage = "https://github.com/Waddah0-0/margin"
Source = "https://github.com/Waddah0-0/margin/tree/main/agents/commit_graph"
Issues = "https://github.com/Waddah0-0/margin/issues"

[project.entry-points."margin.agents"]
commit-graph = "commit_graph.agent:CommitGraphAgent"

[tool.margin]
id = "commit-graph"
stage = "experimental"
# Turn on mirroring once the agent does real work (and set stage to "experimental"):
# mirror = "<owner>/margin-commit-graph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_graph"]
