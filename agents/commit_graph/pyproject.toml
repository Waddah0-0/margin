[project]
name = "margin-commit-graph"
version = "0.1.0"
description = "Draws a repository's history as its tree and tells the story in it."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Waddah Ali" }]
keywords = ["git", "history", "visualization", "repository", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "margin-core>=0.1.3,<0.2",  # 0.1.3: reading history never fetches over the network
]

[project.urls]
Homepage = "https://github.com/Waddah0-0/margin"
Source = "https://github.com/Waddah0-0/margin/tree/main/agents/commit_graph"
Issues = "https://github.com/Waddah0-0/margin/issues"
Changelog = "https://github.com/Waddah0-0/margin/blob/main/agents/commit_graph/CHANGELOG.md"

[project.entry-points."margin.agents"]
commit-graph = "commit_graph.agent:CommitGraphAgent"

[tool.margin]
id = "commit-graph"
stage = "experimental"
mirror = "Waddah0-0/margin-commit-graph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commit_graph"]
